### 🧠 BASE ###
set -g mouse on                    # abilita il mouse
set -g history-limit 10000         # scroll lungo
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm-256color:Tc' # colori veri
setw -g mode-keys vi               # vi-style in copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

### 💾 PLUGIN MANAGER (TPM) ###
# Installazione: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-net-speed'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'

### 🎨 CATPPUCCIN THEME ###
set -g @catppuccin_flavour 'mocha'
set -g status-interval 5
set -g status-justify centre
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator ""
set -g @catppuccin_status_modules_right "battery network date_time"
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_date_time_text "%Y-%m-%d %H:%M"

### ⚡ PERFORMANCE ###
set-option -g renumber-windows on
set-option -g escape-time 10
set-option -g base-index 1
setw -g pane-base-index 1

### 🛠️ RUN TPM ###
run '~/.tmux/plugins/tpm/tpm'

